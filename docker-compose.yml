name: kafka-stend

x-kafka-image: &kafka-image apache/kafka:4.1.0

x-kafka-common: &kafka-common
  image: *kafka-image
  restart: unless-stopped
  # 768m > heap 512m: запас на metaspace, direct memory и OS внутри контейнера.
  mem_limit: 768m

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9095,3@kafka3:9097
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_JMX_PORT: 9999
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

x-kafka-healthcheck: &kafka-healthcheck
  # Проверка поднимает JVM-клиент; реже, чтобы не конкурировать с прогоном.
  interval: 60s
  timeout: 60s
  retries: 5
  start_period: 60s

services:
  kafka1:
    <<: *kafka-common
    hostname: kafka1
    cpuset: "0"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_JMX_HOSTNAME: kafka1
    healthcheck:
      <<: *kafka-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka1:9092 > /dev/null 2>&1"]

  kafka2:
    <<: *kafka-common
    hostname: kafka2
    cpuset: "1"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9094
      KAFKA_JMX_HOSTNAME: kafka2
    healthcheck:
      <<: *kafka-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka2:9094 > /dev/null 2>&1"]

  kafka3:
    <<: *kafka-common
    hostname: kafka3
    cpuset: "2"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9096,CONTROLLER://:9097
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9096
      KAFKA_JMX_HOSTNAME: kafka3
    healthcheck:
      <<: *kafka-healthcheck
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka3:9096 > /dev/null 2>&1"]

  # Одноразовый сервис: создаёт топик и завершается с кодом 0.
  # Клиенты стартуют только после него (service_completed_successfully).
  kafka-init:
    image: *kafka-image
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka1:9092,kafka2:9094,kafka3:9096 \
          --create --if-not-exists \
          --topic "${KAFKA_TOPIC:-load-test}" \
          --partitions "${TOPIC_PARTITIONS:-6}" \
          --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka1:9092 \
          --describe --topic "${KAFKA_TOPIC:-load-test}"
    restart: "no"

  consumer:
    build: ./consumer
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9094,kafka3:9096
      KAFKA_TOPIC: ${KAFKA_TOPIC:-load-test}
      CONSUMER_GROUPS: group-1,group-2,group-3
      METRICS_PORT: 8002
    ports:
      - "8002:8002"

  # Продюсер стартует вместе со стендом, но отправку запускает только POST /runs.
  producer:
    build: ./producer
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9094,kafka3:9096
      KAFKA_TOPIC: ${KAFKA_TOPIC:-load-test}
      TOTAL_MESSAGES: ${TOTAL_MESSAGES:-100000}
      HTTP_PORT: 8001
      PRODUCER_LINGER_MS: ${PRODUCER_LINGER_MS:-50}
      PRODUCER_BATCH_SIZE: ${PRODUCER_BATCH_SIZE:-1048576}
      PRODUCER_COMPRESSION_TYPE: ${PRODUCER_COMPRESSION_TYPE:-snappy}
      PRODUCER_QUEUE_BUFFERING_MAX_MESSAGES: ${PRODUCER_QUEUE_BUFFERING_MAX_MESSAGES:-200000}
      PRODUCER_ACKS: ${PRODUCER_ACKS:-1}
      PRODUCER_ENABLE_IDEMPOTENCE: ${PRODUCER_ENABLE_IDEMPOTENCE:-false}
    ports:
      - "8001:8001"
    restart: unless-stopped
    # Время на flush() при остановке во время прогона (PRODUCER_FLUSH_TIMEOUT_S = 30 с).
    stop_grace_period: 90s

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-stend
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9094,kafka3:9096
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Sidecar: общий network namespace с брокером, JMX на localhost:9999.
  # Один и тот же kafka-jmx-exporter.yml на все три экземпляра.
  jmx-exporter-1:
    image: sourcemation/jmx-exporter:1.7.0
    network_mode: service:kafka1
    depends_on:
      kafka1: { condition: service_healthy }
    volumes:
      - ./jmx-exporter/kafka-jmx-exporter.yml:/config.yaml:ro
    command: ["7071", "/config.yaml"]
    restart: unless-stopped

  jmx-exporter-2:
    image: sourcemation/jmx-exporter:1.7.0
    network_mode: service:kafka2
    depends_on:
      kafka2: { condition: service_healthy }
    volumes:
      - ./jmx-exporter/kafka-jmx-exporter.yml:/config.yaml:ro
    command: ["7071", "/config.yaml"]
    restart: unless-stopped

  jmx-exporter-3:
    image: sourcemation/jmx-exporter:1.7.0
    network_mode: service:kafka3
    depends_on:
      kafka3: { condition: service_healthy }
    volumes:
      - ./jmx-exporter/kafka-jmx-exporter.yml:/config.yaml:ro
    command: ["7071", "/config.yaml"]
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command:
      - --kafka.server=kafka1:9092
      - --kafka.server=kafka2:9094
      - --kafka.server=kafka3:9096
      - --kafka.version=4.0.0
      - --offset.show-all
    ports:
      - "9308:9308"
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - jmx-exporter-1
      - jmx-exporter-2
      - jmx-exporter-3
      - kafka-exporter
      - producer
      - consumer
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus:
  grafana:
